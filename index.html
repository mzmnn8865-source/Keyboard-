<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1016" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>REDRAGON WYVERN K689 PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-ui: 'Vazirmatn', 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }
    .app[data-theme='dark'] {
      --bg0: #0E1016; --bg1: #171A23; --glow: rgba(126, 214, 192, 0.11);
      --surface: rgba(24, 27, 36, 0.84); --surface-2: #202533; --surface-3: #2A3040;
      --line: #2C3243; --text: #ECE9E1; --muted: #9AA2B4;
      --accent: #7ED6C0; --accent-ink: #08201A; --warm: #F0A55C; --danger: #F2837F;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.38), 0 1px 0 rgba(255, 255, 255, 0.045) inset;
    }
    .app[data-theme='light'] {
      --bg0: #F2EDE3; --bg1: #E6DFD0; --glow: rgba(31, 138, 116, 0.12);
      --surface: rgba(251, 248, 242, 0.9); --surface-2: #F1ECE1; --surface-3: #E5DECE;
      --line: #D7CEBC; --text: #26231E; --muted: #7C7466;
      --accent: #1F8A74; --accent-ink: #FFFFFF; --warm: #C9691F; --danger: #C4473F;
      --shadow: 0 12px 28px rgba(60, 48, 30, 0.15), 0 1px 0 rgba(255, 255, 255, 0.75) inset;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #0E1016;
      overscroll-behavior: none; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    body { font-family: var(--font-ui); }
    button { font: inherit; color: inherit; cursor: pointer; }
    svg { display: block; flex: none; }

    .app {
      position: fixed; inset: 0; overflow: hidden; color: var(--text);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      font-size: 14px; line-height: 1.5; outline: none;
    }
    .bg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .bg-glow { position: absolute; inset: 0; background: radial-gradient(900px 520px at 50% 64%, var(--glow), transparent 70%); }
    .bg-grain {
      position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .canvas-mount { position: absolute; inset: 0; z-index: 10; }
    .canvas-mount canvas { display: block; touch-action: none; }

    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px) saturate(1.15); backdrop-filter: blur(14px) saturate(1.15);
    }

    /* ---------- buttons ---------- */
    .btn, .icon-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; height: 36px; padding: 0 13px; font-size: 13px; font-weight: 500;
      white-space: nowrap; transition: background .15s, border-color .15s, transform .08s, color .15s;
    }
    .icon-btn { width: 38px; height: 38px; padding: 0; }
    .btn:hover, .icon-btn:hover { background: var(--surface-3); }
    .btn:active, .icon-btn:active { transform: translateY(1px); }
    .btn[aria-pressed='true'], .icon-btn[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .btn.danger { color: var(--danger); }
    .btn.sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- top bar ---------- */
    .topbar {
      position: absolute; z-index: 20; top: calc(10px + var(--safe-t)); inset-inline: calc(12px + var(--safe-l)) calc(12px + var(--safe-r));
      display: flex; align-items: center; gap: 12px; pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: #EA5514; display: grid; place-items: center; box-shadow: 0 2px 0 #B83E0B, 0 5px 10px rgba(234, 85, 20, 0.35); color: #fff; }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-text b { font-family: 'Plus Jakarta Sans', var(--font-ui); font-weight: 800; font-size: 13.5px; letter-spacing: .06em; }
    .brand-text small { color: var(--muted); font-size: 10.5px; margin-top: 2px; }
    .lastkey { margin-inline: auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; direction: ltr; }
    .lk-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .lk-val { min-width: 42px; text-align: center; font-weight: 600; }
    .top-actions { display: flex; gap: 6px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    .top-actions .icon-btn { background: transparent; border-color: transparent; }
    .top-actions .icon-btn:hover { background: var(--surface-2); }
    .top-actions .icon-btn[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); }

    /* ---------- text panel ---------- */
    .textpanel {
      position: absolute; z-index: 20; left: 50%; transform: translateX(-50%);
      top: calc(72px + var(--safe-t)); width: min(780px, calc(100vw - 24px)); padding: 10px 12px 12px;
      transition: width .2s;
    }
    .tp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .tp-title { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; }
    .tp-title svg { color: var(--accent); }
    .tp-chips { display: flex; gap: 6px; align-items: center; flex: 1; flex-wrap: wrap; }
    .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chip b { color: var(--text); font-weight: 700; }
    .chip.on { background: color-mix(in srgb, var(--warm) 22%, transparent); border-color: var(--warm); color: var(--warm); }
    .chip.hot { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: var(--accent); color: var(--accent); }
    .tp-actions { display: flex; gap: 5px; }
    .tp-actions .btn { height: 30px; padding: 0 9px; font-size: 12px; }
    .tp-body {
      position: relative; min-height: 78px; max-height: 118px; overflow-y: auto; touch-action: pan-y;
      padding: 10px 14px; border-radius: 11px; background: var(--bg0); border: 1px solid var(--line);
      font-size: 19px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; tab-size: 4;
      user-select: text; -webkit-user-select: text; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.18);
    }
    .tp-body.is-empty::before { content: attr(data-ph); color: var(--muted); opacity: .7; font-size: 14px; position: absolute; inset-inline-start: 14px; top: 12px; pointer-events: none; }
    .caret { display: inline-block; width: 2px; height: 1.15em; background: var(--accent); vertical-align: text-bottom; margin-inline: 1px; animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .tp-body .ok { color: var(--text); }
    .tp-body .bad { color: var(--danger); background: color-mix(in srgb, var(--danger) 18%, transparent); border-radius: 3px; }
    .tp-body .todo { color: var(--muted); }
    .tp-body .cur { background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 3px; }
    .textpanel.min .tp-body { display: none; }
    .textpanel.min .tp-head { margin-bottom: 0; }

    /* ---------- hud ---------- */
    .hud { position: absolute; z-index: 15; inset-inline-start: calc(14px + var(--safe-l)); bottom: calc(14px + var(--safe-b)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; }
    .hud-row { display: flex; gap: 5px; flex-wrap: wrap; direction: ltr; }
    .hud .chip { background: var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .hist { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); animation: pop .18s ease-out; }
    .hist:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    @keyframes pop { from { transform: translateY(4px) scale(.9); opacity: 0; } }

    /* ---------- dock ---------- */
    .dock { position: absolute; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); display: flex; gap: 4px; padding: 5px; border-radius: 18px; }
    .dock-btn { display: flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px; border-radius: 13px; background: transparent; border: 1px solid transparent; font-size: 13px; font-weight: 500; color: var(--text); transition: background .15s, transform .08s; white-space: nowrap; }
    .dock-btn:hover { background: var(--surface-2); }
    .dock-btn:active { transform: translateY(1px); }
    .dock-btn[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); }
    .dock-sep { width: 1px; background: var(--line); margin: 6px 3px; }

    .pop { position: absolute; z-index: 25; left: 50%; transform: translateX(-50%); bottom: calc(66px + var(--safe-b)); width: min(420px, calc(100vw - 24px)); padding: 12px 14px; }
    .pop[hidden] { display: none; }

    /* ---------- drawer ---------- */
    .drawer {
      position: absolute; z-index: 30; top: calc(10px + var(--safe-t)); bottom: calc(10px + var(--safe-b)); right: calc(10px + var(--safe-r));
      width: min(396px, calc(100vw - 20px)); display: flex; flex-direction: column; overflow: hidden;
      transform: translateX(calc(100% + 30px)); transition: transform .28s cubic-bezier(.2, .8, .2, 1); visibility: hidden;
    }
    .drawer.open { transform: none; visibility: visible; }
    .drawer-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 0 10px; border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
    .tab { background: none; border: none; padding: 10px 11px 11px; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab[aria-selected='true'] { color: var(--text); border-bottom-color: var(--accent); font-weight: 700; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 6px 16px 22px; touch-action: pan-y; overscroll-behavior: contain; }
    .drawer-body::-webkit-scrollbar { width: 6px; }
    .drawer-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    .sec { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 20px 0 6px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
    .sec::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
    .row.col { flex-direction: column; align-items: stretch; gap: 2px; padding: 6px 0; }
    .row-top { display: flex; justify-content: space-between; align-items: baseline; }
    .lbl { font-size: 13px; }
    .hint { font-size: 11.5px; color: var(--muted); margin: 2px 0 6px; line-height: 1.65; }
    .val { font-family: var(--font-mono); font-size: 12px; color: var(--muted); direction: ltr; }
    .stack { display: flex; flex-direction: column; gap: 6px; }
    .wrap { display: flex; gap: 6px; flex-wrap: wrap; }

    input[type='range'] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; direction: ltr; touch-action: pan-y; cursor: pointer; }
    input[type='range']::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 50%) 100% no-repeat, var(--line); }
    input[type='range']::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
    input[type='range']::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
    input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--text); border: 3px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
    input[type='range']::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 3px solid var(--accent); }

    .swatch { -webkit-appearance: none; appearance: none; width: 34px; height: 34px; padding: 0; border-radius: 10px; border: 2px solid var(--line); background: none; cursor: pointer; overflow: hidden; flex: none; }
    .swatch::-webkit-color-swatch-wrapper { padding: 0; }
    .swatch::-webkit-color-swatch { border: none; border-radius: 7px; }
    .swatch::-moz-color-swatch { border: none; border-radius: 7px; }
    .color-pair { display: flex; gap: 6px; }

    .seg { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; flex-wrap: wrap; }
    .seg button { background: none; border: none; border-radius: 8px; padding: 5px 11px; font-size: 12.5px; color: var(--muted); font-weight: 500; transition: background .15s; }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .seg.full { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }

    .sw { position: relative; width: 42px; height: 24px; flex: none; }
    .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
    .sw i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); transition: background .18s; }
    .sw i::after { content: ''; position: absolute; top: 2px; inset-inline-start: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform .18s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
    .sw input:checked + i { background: var(--accent); border-color: var(--accent); }
    .sw input:checked + i::after { transform: translateX(-18px); background: var(--accent-ink); }

    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { text-align: start; padding: 10px 11px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, transform .08s; }
    .card:hover { border-color: var(--muted); }
    .card:active { transform: scale(.985); }
    .card[aria-pressed='true'] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .card b { font-size: 12.5px; }
    .card small { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .dots { display: flex; gap: 3px; direction: ltr; }
    .dots i { width: 16px; height: 16px; border-radius: 5px; border: 1px solid rgba(128, 128, 128, .35); }

    .field { width: 100%; background: var(--bg0); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; color: var(--text); font: inherit; font-size: 13px; user-select: text; -webkit-user-select: text; touch-action: manipulation; }
    .list { display: flex; flex-direction: column; gap: 6px; }
    .item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
    .item span { flex: 1; font-size: 13px; }
    .bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    /* ---------- misc ---------- */
    .callouts { position: absolute; inset: 0; z-index: 15; pointer-events: none; }
    .callout { position: absolute; top: 0; left: 0; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .callout b { padding: 2px 7px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .callout i { width: 22px; height: 1px; background: var(--accent); }
    .callout span { color: var(--text); background: var(--surface); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }

    .toast { position: absolute; z-index: 60; left: 50%; top: calc(18px + var(--safe-t)); transform: translate(-50%, -80px); padding: 9px 16px; border-radius: 12px; background: var(--text); color: var(--bg0); font-size: 13px; font-weight: 600; transition: transform .3s cubic-bezier(.2, .8, .2, 1); pointer-events: none; max-width: calc(100vw - 30px); text-align: center; }
    .toast.show { transform: translate(-50%, 0); }

    .rotate-hint { position: absolute; z-index: 22; left: 50%; transform: translateX(-50%); bottom: calc(76px + var(--safe-b)); width: min(360px, calc(100vw - 24px)); padding: 12px 14px; display: none; align-items: center; gap: 10px; font-size: 12.5px; }
    .rotate-hint p { margin: 0; flex: 1; line-height: 1.6; }
    @media (orientation: portrait) and (pointer: coarse) { .rotate-hint:not(.gone) { display: flex; } }

    .modal { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(5, 6, 10, .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .modal[hidden] { display: none; }
    .modal-card { width: min(380px, calc(100vw - 28px)); padding: 22px; text-align: center; }
    .big { font-size: 56px; font-weight: 800; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
    .stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 4px; }
    .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat small { color: var(--muted); font-size: 11px; }

    @media (max-width: 900px) { .dock-btn span { display: none; } .dock-btn { padding: 0 12px; } .brand-text small { display: none; } }
    @media (max-width: 640px) { .brand-text { display: none; } .brand { padding: 5px; } .lastkey { display: none; } .top-actions { margin-inline-start: auto; } .hud { display: none; } }
    @media (max-height: 520px) {
      .topbar { top: calc(6px + var(--safe-t)); }
      .brand-mark { width: 26px; height: 26px; }
      .brand { padding: 4px 10px 4px 8px; }
      .top-actions { padding: 3px; gap: 3px; }
      .icon-btn { width: 32px; height: 32px; }
      .textpanel { top: calc(48px + var(--safe-t)); padding: 6px 8px 8px; width: min(640px, calc(100vw - 20px)); }
      .tp-head { margin-bottom: 5px; gap: 6px; }
      .tp-body { min-height: 46px; max-height: 58px; font-size: 16px; line-height: 1.6; padding: 5px 10px; }
      .dock { bottom: calc(6px + var(--safe-b)); padding: 3px; border-radius: 14px; }
      .dock-btn { height: 34px; padding: 0 11px; }
      .pop { bottom: calc(50px + var(--safe-b)); }
      .drawer { top: calc(6px + var(--safe-t)); bottom: calc(6px + var(--safe-b)); right: calc(6px + var(--safe-r)); width: min(370px, 52vw); }
      .hud { bottom: calc(8px + var(--safe-b)); }
      .toast { top: calc(10px + var(--safe-t)); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /* =====================================================================
       Helpers
    ===================================================================== */
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const deepClone = (o) => JSON.parse(JSON.stringify(o));

    function hexToRgb(hex) {
      let h = String(hex || '#000000').replace('#', '');
      if (h.length === 3) h = h.split('').map((c) => c + c).join('');
      const n = parseInt(h, 16) || 0;
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

    function rgbToHex(r, g, b) {

      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (brown) {
          last = (last + 0.02 * w) / 1.02;

    function voice(ctx, spec, prof, recipe, gainMul, isDown) {

      const hum = s.variation;
      const big = spec.w >= 1.5 || spec.h >= 2;
      const space = spec.id === 'space';
      const fixed = !!prof.fixed;
      const keyChar = fixed ? 1 : 1 + (strHash(spec.id) - 0.5) * 0.07;
      const jit = fixed ? 1 : 1 + (Math.random() * 2 - 1) * 0.07 * hum * 2;
      const rowMul = fixed ? 1 : 1.05 - spec.row * 0.018;
      const sizeMul = fixed ? 1 : space ? 0.74 : big ? 0.86 : 1;
      const p = Math.pow(2, s.pitch / 12) * (prof.pitch || 1) * rowMul * sizeMul * keyChar * jit;
      const g = gainMul * (prof.gain || 1) * (1 + (Math.random() * 2 - 1) * 0.18 * hum * 2);
      const pan = clamp(((spec.x / 22.7) * 2 - 1) * 0.6 * s.width * 2, -0.9, 0.9);
      const nodes = [];
      let out = AUDIO.bus;
      if (ctx.createStereoPanner) {
        const pn = ctx.createStereoPanner();
        pn.pan.value = pan;
        pn.connect(AUDIO.bus);
        nodes.push(pn);
        out = pn;
      }
      if (prof.lp) {
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = prof.lp; lp.Q.value = 0.6;
        lp.connect(out); nodes.push(lp); out = lp;

        const hp = ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = prof.hp; hp.Q.value = 0.6;
        hp.connect(out); nodes.push(hp); out = hp;

      const note = PENTA[idx % 5] + 12 * Math.floor(idx / 5);
      const f0 = 261.6 * Math.pow(2, note / 12);
      const t0 = ctx.currentTime + 0.004;
      const N = (o) => vNoise(ctx, out, t0 + (o.at || 0), { ...o, f: o.f * p, f2: o.f2 && o.f2 * p, g: o.g * g });
      const R = (o) => vRing(ctx, out, t0 + (o.at || 0), { ...o, f: o.f * p, f2: o.f2 && o.f2 * p, g: o.g * g });
      recipe(N, R, { big, space, id: spec.id, f0 });

    function resolveKeyEventCandidates(event) {
      const candidates = [];
      if (event.code) {
        candidates.push(event.code.toLowerCase());
        if (event.code.startsWith('Key')) {
          candidates.push(event.code.slice(3).toLowerCase());
        }
        if (event.code.startsWith('Digit')) {
          candidates.push(`n${event.code.slice(5)}`);
        }
      }
      if (event.key) {
        const rawKey = event.key;
        const lowerKey = rawKey.toLowerCase();
        candidates.push(lowerKey);

        if (PERSIAN_TO_KEY_ID[rawKey]) {
          candidates.push(PERSIAN_TO_KEY_ID[rawKey]);
        }
        if (CHAR_FALLBACK_TO_ID[lowerKey]) {
          if (event.location === 2) {
            if (lowerKey === 'shift') candidates.push('rshift');
            else if (lowerKey === 'control') candidates.push('rctrl');
            else if (lowerKey === 'alt') candidates.push('ralt');
          }
          if (event.location === 3) {
            if (lowerKey === 'enter') candidates.push('numenter');
            else if (lowerKey === '+') candidates.push('numadd');
            else if (lowerKey === '-') candidates.push('numsub');
            else if (lowerKey === '*') candidates.push('nummul');
            else if (lowerKey === '/') candidates.push('numdiv');
            else if (lowerKey === '.') candidates.push('numdot');
            else if (/^[0-9]$/.test(lowerKey)) candidates.push(`num${lowerKey}`);
          }
          candidates.push(CHAR_FALLBACK_TO_ID[lowerKey]);
        }
      }
      return candidates;
    }

      const scale = getResponsiveCameraScale();
      let base;
      if (modelType === 'keyboard') {
        switch (preset) {
          case '3/4':
            base = { position: [-1.45, 4.85, 11.4], target: [0, 0.1, 0] };
            break;
          case 'front':
            base = { position: [0, 2.2, 12.2], target: [0, 0.1, 0] };
            break;
          case 'side':
            base = { position: [12.4, 2.8, 0], target: [0, 0.1, 0] };
            break;
          case 'top':
            base = { position: [0, 12.6, 0.01], target: [0, 0, 0] };
            break;
          case 'btm':
            base = { position: [0, -12.2, 0.01], target: [0, 0, 0] };
            break;
        }
      } else {
        switch (preset) {
          case '3/4':
            base = { position: [-4.5, 3.1, 8.2], target: [0, 0.35, 0] };
            break;
          case 'front':
            base = { position: [0, 1.6, 9.2], target: [0, 0.35, 0] };
            break;
          case 'side':
            base = { position: [9.0, 1.6, 0], target: [0, 0.35, 0] };
            break;
          case 'top':
            base = { position: [0, 10.8, 0.01], target: [0, 0.35, 0] };
            break;
          case 'btm':
            base = { position: [0, -8.8, 0.01], target: [0, 0.35, 0] };
            break;
        }
      }
      return {
        position: [
          base.position[0] * scale,
          base.position[1] * scale,
          base.position[2] * scale,
        ],
        target: base.target,
      };
    }

    function createRoundedRectShape(width, height, radius) {
      const shape = new THREE.Shape();
      const x = -width / 2;
      const y = -height / 2;
      const r = Math.min(radius, width / 2, height / 2);

      shape.moveTo(x + r, y);
      shape.lineTo(x + width - r, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + r);
      shape.lineTo(x + width, y + height - r);
      shape.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      shape.lineTo(x + r, y + height);
      shape.quadraticCurveTo(x, y + height, x, y + height - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    function createRoundedSculptedKeycapGeometry(
      widthWorld,
      depthWorld,
      heightWorld,
      topTiltRad,
      isSpacebar = false,
    ) {
      const segX = 16;
      const segY = 6;
      const segZ = 16;
      const geo = new THREE.BoxGeometry(widthWorld, heightWorld, depthWorld, segX, segY, segZ);

      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      const norm = geo.attributes.normal;

      const halfH = heightWorld / 2;
      const baseHalfW = widthWorld / 2;
      const baseHalfD = depthWorld / 2;

      const insetWorld = 0.048;
      const topHalfW = Math.max(baseHalfW * 0.72, baseHalfW - insetWorld);
      const topHalfD = Math.max(baseHalfD * 0.7, baseHalfD - insetWorld);

      const baseCornerR = Math.min(baseHalfW, baseHalfD) * 0.34;
      const topCornerR = Math.min(topHalfW, topHalfD) * 0.38;

      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);

        const nY = norm.getY(i);

        const t = Math.max(0, Math.min(1, (vy + halfH) / heightWorld));

        const profileCurve = Math.pow(t, 0.82);
        let bevelShrink = 0;
        if (t > 0.74) {
          const bt = (t - 0.74) / 0.26;
          bevelShrink = (1 - Math.cos(bt * Math.PI * 0.5)) * 0.018;
        }

        const curHalfW = Math.max(
          0.05,
          THREE.MathUtils.lerp(baseHalfW, topHalfW, profileCurve) - bevelShrink,
        );
        const curHalfD = Math.max(
          0.05,
          THREE.MathUtils.lerp(baseHalfD, topHalfD, profileCurve) - bevelShrink,
        );
        const curRadius = THREE.MathUtils.lerp(baseCornerR, topCornerR, profileCurve);

        const rawX = (vx / baseHalfW) * curHalfW;
        const rawZ = (vz / baseHalfD) * curHalfD;

        const innerW = Math.max(0, curHalfW - curRadius);
        const innerD = Math.max(0, curHalfD - curRadius);

        const clampedX = Math.max(-innerW, Math.min(innerW, rawX));
        const clampedZ = Math.max(-innerD, Math.min(innerD, rawZ));

        const dx = rawX - clampedX;
        const dz = rawZ - clampedZ;

        let finalX = rawX;
        let finalZ = rawZ;

        if (Math.abs(dx) > 1e-5 && Math.abs(dz) > 1e-5) {
          const nx = dx / curRadius;
          const nz = dz / curRadius;
          const maxComp = Math.max(Math.abs(nx), Math.abs(nz));
          const len = Math.sqrt(nx * nx + nz * nz);
          if (len > 1e-6) {
            const scaleToCircle = (maxComp / len) * curRadius;
            finalX = clampedX + nx * scaleToCircle;
            finalZ = clampedZ + nz * scaleToCircle;
          }
        }

        finalZ -= profileCurve * 0.018;

        let finalY = vy;
        if (t > 0.74) {
          const bt = (t - 0.74) / 0.26;
          const edgeDistX = Math.abs(finalX) / curHalfW;
          const edgeDistZ = Math.abs(finalZ) / curHalfD;
          const edgeRadial = Math.min(1, Math.hypot(edgeDistX * 0.7, edgeDistZ * 0.7));

          const rimDrop = Math.pow(edgeRadial, 3.2) * 0.022 * bt;

          const normX = finalX / curHalfW;
          const dish = isSpacebar
            ? 0.018 * (1 - normX * normX * 0.3) * bt
            : -0.016 * (1 - normX * normX * 0.85) * bt;

          finalY += dish - rimDrop + finalZ * Math.tan(topTiltRad) * bt;
        }

        pos.setXYZ(i, finalX, finalY, finalZ);

        if (nY > 0.5) {
          const u = THREE.MathUtils.clamp(finalX / (topHalfW * 1.92) + 0.5, 0.01, 0.99);
          const v = THREE.MathUtils.clamp(0.5 - finalZ / (topHalfD * 1.92), 0.01, 0.99);
          uv.setXY(i, u, v);
        }
      }

      geo.computeVertexNormals();
      return geo;
    }

    function drawCanvasRoundedRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function paintKeycapCanvas(canvas, spec) {
      spec = localizeSpec(spec);
      const canvasW = canvas.width;
      const canvasH = canvas.height;
      const ctx = canvas.getContext('2d');

      const role = resolveKeyColors(spec);
      const bgHex = role.bg;
      const fgHex = role.fg;
      const subFgHex = hexToRgba(role.fg, 0.9);
      const lightKey = hexLum(role.bg) > 0.6;

      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, canvasW, canvasH);

      const dishGrad = ctx.createRadialGradient(
        canvasW * 0.5,
        canvasH * 0.48,
        canvasW * 0.06,
        canvasW * 0.5,
        canvasH * 0.5,
        canvasW * 0.56,
      );
      dishGrad.addColorStop(0, mixHex(role.bg, '#FFFFFF', lightKey ? 0.3 : 0.08));
      dishGrad.addColorStop(0.75, role.bg);
      dishGrad.addColorStop(1, mixHex(role.bg, '#000000', lightKey ? 0.1 : 0.24));
      ctx.fillStyle = dishGrad;
      ctx.fillRect(0, 0, canvasW, canvasH);

      const pad = 26;
      const cornerR = Math.min(canvasW, canvasH) * 0.22;
      drawCanvasRoundedRect(
        ctx,
        pad,
        pad,
        canvasW - pad * 2,
        canvasH - pad * 2,
        cornerR,
      );
      ctx.strokeStyle = lightKey ? 'rgba(255, 255, 255, 0.75)' : 'rgba(255, 255, 255, 0.22)';
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';

      const fontStack = SETTINGS.view.lang === 'fa'
        ? '"Vazirmatn", "Plus Jakarta Sans", sans-serif'
        : '"Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif';

      const drawCrispText = (text, x, y, fill, strokePx = 3.5) => {
        ctx.fillStyle = fill;
        ctx.strokeStyle = fill;
        ctx.lineWidth = strokePx;
        ctx.strokeText(text, x, y);
        ctx.fillText(text, x, y);
      };

      if (spec.id === 'space') {
        ctx.fillStyle = hexToRgba(fgHex, 0.96);
        drawCanvasRoundedRect(
          ctx,
          canvasW * 0.41,
          canvasH * 0.46,
          canvasW * 0.18,
          18,
          9,
        );
        ctx.fill();
      } else if (spec.id === 'esc') {
        ctx.font = `800 116px ${fontStack}`;
        drawCrispText('Esc', canvasW * 0.46, canvasH * 0.45, fgHex, 3);
      } else if (spec.subLabel && spec.row === 1 && spec.zone === 'main') {
        ctx.font = `800 142px ${fontStack}`;
        drawCrispText(spec.label, canvasW * 0.33, canvasH * 0.46, fgHex, 3.5);

        ctx.font = `800 112px ${fontStack}`;
        drawCrispText(spec.subLabel, canvasW * 0.68, canvasH * 0.45, subFgHex, 2.5);
      } else if (spec.subLabel && !spec.bottomLabel) {
        if (spec.w >= 1.5 && spec.id === 'num0') {
          ctx.font = `800 136px ${fontStack}`;
          drawCrispText(spec.label, canvasW * 0.36, canvasH * 0.48, fgHex, 3.5);
          ctx.font = `800 106px ${fontStack}`;
          drawCrispText(spec.subLabel, canvasW * 0.63, canvasH * 0.49, subFgHex, 2.5);
        } else {
          ctx.font =
            spec.label.length > 2
              ? `800 112px ${fontStack}`
              : `800 138px ${fontStack}`;
          drawCrispText(spec.label, canvasW * 0.5, canvasH * 0.36, fgHex, 3.2);

          ctx.font = `800 94px ${fontStack}`;
          drawCrispText(spec.subLabel, canvasW * 0.5, canvasH * 0.70, subFgHex, 2.2);
        }
      } else if (spec.bottomLabel) {
        ctx.font =
          spec.label.length > 2
            ? `800 106px ${fontStack}`
            : spec.label.length > 1
              ? `800 122px ${fontStack}`
              : `800 148px ${fontStack}`;
        drawCrispText(spec.label, canvasW * 0.5, canvasH * 0.36, fgHex, 3.2);

        ctx.font = `800 78px ${fontStack}`;
        drawCrispText(spec.bottomLabel, canvasW * 0.5, canvasH * 0.72, subFgHex, 1.8);
      } else {
        const len = spec.label.length;
        const fontSize =
          len === 1
            ? 174
            : len === 2
              ? 136
              : len === 3
                ? 118
                : len <= 5
                  ? 100
                  : 90;
        ctx.font = `800 ${fontSize}px ${fontStack}`;
        drawCrispText(
          spec.label,
          canvasW * 0.5,
          canvasH * 0.46,
          fgHex,
          len === 1 ? 4.2 : 3.0,
        );
      }

      if (spec.id === 'f' || spec.id === 'j' || spec.id === 'num5') {
        ctx.fillStyle = fgHex;
        drawCanvasRoundedRect(
          ctx,
          canvasW * 0.34,
          canvasH * 0.76,
          canvasW * 0.32,
          16,
          8,
        );
        ctx.fill();
      }
    }

    function createKeycapTopTexture(spec, maxAnisotropy) {
      const canvasW = spec.w >= 2 ? 1024 : 512;
      const canvasH = spec.h >= 2 ? 1024 : 512;
      const canvas = document.createElement('canvas');
      canvas.width = canvasW;
      canvas.height = canvasH;

      paintKeycapCanvas(canvas, spec);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = maxAnisotropy;
      tex.needsUpdate = true;
      return tex;
    }

    function createRgbBacklightCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return { canvas, ctx, texture };
    }

    function drawRgbRainbowWave(ctx, w, h, phase, intensityBoost = 0) {
      const c = SETTINGS.rgb;
      const ph = phase * c.speed;
      if (c.mode === 'off') {
        ctx.fillStyle = '#0a0b0f';
        ctx.fillRect(0, 0, w, h);
      } else if (c.mode === 'solid') {
        ctx.fillStyle = c.c1;
        ctx.fillRect(0, 0, w, h);
      } else if (c.mode === 'breath') {
        const k = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(ph * 1.7));
        ctx.fillStyle = mixHex('#08090c', c.c1, k);
        ctx.fillRect(0, 0, w, h);
      } else if (c.mode === 'gradient') {
        const g = ctx.createLinearGradient(0, 0, w, h * 0.6);
        for (let i = 0; i <= 8; i++) {
          const t = i / 8;
          g.addColorStop(t, mixHex(c.c1, c.c2, 0.5 + 0.5 * Math.sin(t * Math.PI * 2 - ph * 1.3)));
        }
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      } else if (c.mode === 'reactive') {
        ctx.fillStyle = mixHex('#08090c', c.c1, Math.min(1, 0.16 + RGB_RUNTIME.heat * 0.75));
        ctx.fillRect(0, 0, w, h);
        if (RGB_RUNTIME.flash > 0.02) {
          ctx.fillStyle = hexToRgba(c.c2, Math.min(1, RGB_RUNTIME.flash) * 0.85);
          ctx.fillRect(0, 0, w, h);
        }
      } else {
        const grad = ctx.createLinearGradient(0, 0, w, h * 0.6);
        const stops = 8;
        for (let i = 0; i <= stops; i++) {
          const t = i / stops;
          const hue = ((t * 360 - ph * 95) % 360 + 360) % 360;
          const lightness = Math.min(72, 54 + intensityBoost * 16);
          grad.addColorStop(t, `hsl(${hue}, 100%, ${lightness}%)`);
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      ctx.fillStyle = c.mode === 'off' ? 'rgba(255, 255, 255, 0.05)' : 'rgba(255, 255, 255, 0.42)';
      const cols = 22;
      const rows = 6;
      for (let r = 0; r < rows; r++) {
        for (let cc = 0; cc < cols; cc++) {
          const cx = ((cc + 0.5) / cols) * w;
          const cy = ((r + 0.5) / rows) * h;
          ctx.beginPath();
          ctx.arc(cx, cy, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function createPcbSurfaceTexture(maxAnisotropy) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 320;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#12161F';
      ctx.fillRect(0, 0, 1024, 320);

      ctx.strokeStyle = 'rgba(218, 165, 32, 0.24)';
      ctx.lineWidth = 1.5;
      for (let x = 20; x < 1004; x += 22) {
        ctx.beginPath();
        ctx.moveTo(x, 12);
        ctx.lineTo(x + 14, 160);
        ctx.lineTo(x, 308);
        ctx.stroke();
      }

      const cols = 22;
      const rows = 6;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cx = 28 + (c / (cols - 1)) * 968;
          const cy = 26 + (r / (rows - 1)) * 268;

          ctx.fillStyle = '#07090D';
          ctx.beginPath();
          ctx.arc(cx, cy, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#E5B842';
          ctx.fillRect(cx - 13, cy - 8, 5, 4);
          ctx.fillRect(cx + 8, cy - 8, 5, 4);

          ctx.fillStyle = '#E8EEF5';
          ctx.fillRect(cx - 4, cy + 7, 8, 5);
        }
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.font = '600 13px "IBM Plex Mono", monospace';
      ctx.fillText('REDRAGON WYVERN K689-PRO REV 3.2 // HOT-SWAP TRI-MODE PCB', 32, 312);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      return tex;
    }

    function buildKeyboardModel(maxAnisotropy = 4) {
      const root = new THREE.Group();
      root.name = 'WyvernK689ProRoot';
      root.scale.setScalar(0.84);

      const tiltGroup = new THREE.Group();
      tiltGroup.rotation.x = 0.44;
      root.add(tiltGroup);

      const module01KeycapsGroup = new THREE.Group();
      const module01SwitchesGroup = new THREE.Group();
      const module02PlateGroup = new THREE.Group();
      const module02PcbGroup = new THREE.Group();
      const module03ChassisGroup = new THREE.Group();

      tiltGroup.add(module01KeycapsGroup);
      tiltGroup.add(module01SwitchesGroup);
      tiltGroup.add(module02PlateGroup);
      tiltGroup.add(module02PcbGroup);
      tiltGroup.add(module03ChassisGroup);

      const U = 0.44;
      const totalWidthU = 22.7;
      const totalDepthU = 6.22;
      const centerXOffset = -(totalWidthU * U) / 2;
      const centerZOffset = -(totalDepthU * U) / 2;

      const boardW = totalWidthU * U;
      const boardD = totalDepthU * U;

      const wireframeLines = [];
      const wireMat = new THREE.LineBasicMaterial({
        color: 0xe85b26,
        transparent: true,
        opacity: 0.82,
      });

      const addWireframeOverlay = (mesh, threshold = 24) => {
        const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
        const line = new THREE.LineSegments(edges, wireMat);
        line.visible = false;
        mesh.add(line);
        wireframeLines.push(line);
        return line;
      };

      const sideMatOrange = new THREE.MeshStandardMaterial({
        color: 0xe65312,
        roughness: 0.48,
        metalness: 0.04,
      });
      const sideMatNavy = new THREE.MeshStandardMaterial({
        color: 0x202332,
        roughness: 0.52,
        metalness: 0.06,
      });
      const sideMatWhite = new THREE.MeshStandardMaterial({
        color: 0xe3e6ee,
        roughness: 0.46,
        metalness: 0.03,
      });
      const undersideMat = new THREE.MeshStandardMaterial({
        color: 0x161821,
        roughness: 0.8,
        metalness: 0.05,
      });

      const keys = buildWyvernK689Layout();
      const keyActors = new Map();
      const keyList = [];
      const interactableMeshes = [];
      const raycastMeshes = [];

      const geoCache = new Map();

      const switchHousingGeo = new THREE.BoxGeometry(0.28, 0.22, 0.28);
      const switchHousingMat = new THREE.MeshStandardMaterial({
        color: 0xdbe4f0,
        roughness: 0.25,
        metalness: 0.1,
        transparent: true,
        opacity: 0.85,
      });
      const switchHousingInstanced = new THREE.InstancedMesh(
        switchHousingGeo,
        switchHousingMat,
        keys.length,
      );
      switchHousingInstanced.castShadow = true;

      const switchStemGeo = new THREE.CylinderGeometry(0.065, 0.065, 0.14, 8);
      const switchStemMat = new THREE.MeshStandardMaterial({
        color: 0xf25c19,
        roughness: 0.35,
        metalness: 0.1,
      });
      const switchStemInstanced = new THREE.InstancedMesh(
        switchStemGeo,
        switchStemMat,
        keys.length,
      );

      const dummy = new THREE.Object3D();

      keys.forEach((spec, idx) => {
        const profile = getOemRowProfile(spec.row);
        const isSpace = spec.id === 'space';
        const geoKey = `${spec.w}_${spec.h}_${spec.row}_${isSpace ? 'sp' : 'std'}`;
        let geo = geoCache.get(geoKey);
        if (!geo) {
          const kw = spec.w * U - 0.028;
          const kd = spec.h * U - 0.028;
          geo = createRoundedSculptedKeycapGeometry(
            kw,
            kd,
            profile.height,
            profile.topTiltRad,
            isSpace,
          );
          geoCache.set(geoKey, geo);
        }

        const topTex = createKeycapTopTexture(spec, maxAnisotropy);
        const topMat = new THREE.MeshStandardMaterial({
          map: topTex,
          color: 0xffffff,
          roughness: 0.72,
          metalness: 0.0,
          envMapIntensity: 0.25,
          emissive: new THREE.Color(0x000000),
          emissiveIntensity: 0,
        });

        const sideMat =
          spec.color === 'orange'
            ? sideMatOrange
            : spec.color === 'navy'
              ? sideMatNavy
              : sideMatWhite;

        const materials = [sideMat, sideMat, topMat, undersideMat, sideMat, sideMat];

        const mesh = new THREE.Mesh(geo, materials);
        const wx = centerXOffset + spec.x * U;
        const wz = centerZOffset + spec.z * U;
        const wy = 0.26 + profile.height / 2;

        mesh.position.set(wx, wy, wz);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { keyId: spec.id, keyCode: spec.code, subAssembly: 'module_01' };

        const wf = addWireframeOverlay(mesh, 32);
        module01KeycapsGroup.add(mesh);
        interactableMeshes.push(mesh);
        raycastMeshes.push(mesh);

        const actor = {
          spec,
          mesh,
          topMat,
          wireframe: wf,
          restY: wy,
          currentPress: 0,
          targetPress: 0,
        };
        keyActors.set(spec.id.toLowerCase(), actor);
        keyActors.set(spec.code.toLowerCase(), actor);
        keyList.push(actor);

        dummy.position.set(wx, 0.14, wz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        switchHousingInstanced.setMatrixAt(idx, dummy.matrix);

        dummy.position.set(wx, 0.25, wz);
        dummy.updateMatrix();
        switchStemInstanced.setMatrixAt(idx, dummy.matrix);
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          keyList.forEach((actor) => {
            const tex = actor.topMat.map;
            if (tex && tex.image) {
              paintKeycapCanvas(tex.image, actor.spec);
              tex.needsUpdate = true;
            }
          });
        });
      }

      switchHousingInstanced.instanceMatrix.needsUpdate = true;
      switchHousingInstanced.computeBoundingSphere();
      switchStemInstanced.instanceMatrix.needsUpdate = true;
      switchStemInstanced.computeBoundingSphere();

      module01SwitchesGroup.add(switchHousingInstanced);
      module01SwitchesGroup.add(switchStemInstanced);
      raycastMeshes.push(switchHousingInstanced, switchStemInstanced);

      const { ctx: rgbCanvasCtx, texture: rgbTexture } = createRgbBacklightCanvas();
      drawRgbRainbowWave(rgbCanvasCtx, 512, 160, 0, 0);
      rgbTexture.needsUpdate = true;

      const rgbEmissiveMaterial = new THREE.MeshStandardMaterial({
        map: rgbTexture,
        emissiveMap: rgbTexture,
        emissive: new THREE.Color(0xffffff),
